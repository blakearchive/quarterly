version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blake_quarterly_db
    environment:
      POSTGRES_USER: blake
      POSTGRES_PASSWORD: blake
      POSTGRES_DB: blake_quarterly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blake"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
